<!doctype html>
<!-- Android app only (copied into dist-android by vite.config.ts; Capacitor
     server.errorPath). Shown instead of a blank screen when the WebView is too
     old for the app (android.minWebViewVersion) or the main page fails to load. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joy in the Journey</title>
<style>
  html, body { margin: 0; height: 100%; background: #0F172A; color: #F8FAFC;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { opacity: .8; line-height: 1.5; max-width: 420px; margin: 0 0 18px; }
  button { background: #D4A843; color: #0F172A; border: 0; border-radius: 12px;
    padding: 12px 28px; font-size: 16px; font-weight: 700; }
  small { opacity: .5; margin-top: 18px; font-size: 11px; word-break: break-word; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Joy in the Journey couldn’t start</h1>
  <p>Your phone’s web engine may be out of date. Open the Play Store and update
     <b>Android System WebView</b> and <b>Chrome</b>, then tap Retry.</p>
  <button onclick="location.replace('/')">Retry</button>
  <small id="ua"></small>
</main>
<script>document.getElementById("ua").textContent = navigator.userAgent;</script>
</body>
</html>
